<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apply Now - Hirsch Leasing</title>
  <link rel="icon" type="image/jpg" href="Images/Logo.jpg">
  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background: url('Images/Tour.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 4rem auto;
      background-color: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      padding: 2.5rem;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      border: 1px solid #f3c2c2;
    }

    h1 {
      color: #5a1c1c;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
      color: #333;
    }

    input, textarea, select {
      padding: 0.75rem;
      width: 100%;
      margin-top: 0.25rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      margin-top: 1.5rem;
      padding: 1rem;
      width: 100%;
      background: #5a1c1c;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #4a1616;
    }

    .status {
      margin-top: 1rem;
      text-align: center;
      font-weight: bold;
      padding: 0.75rem;
      border-radius: 5px;
    }

    .success {
      background: #d4edda;
      color: #155724;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>

  <div class="announcement">
    ONLY 1 Property left for 2025-2026 school year!
  </div>

  <header class="navbar">
    <div class="nav-left">
      <a href="aboutUs.html">About Us</a>
      <a href="properties.html">Our Properties</a>
      <a href="contact.html">Contact Us</a>
      <a href="schedule.html">Schedule Tour</a>
    </div>
    <div class="logo"><a href="website.html"><img src="Images/LongLogo.jpg" alt="Hirsch Leasing Logo" style="height: 40px;"></a></div>
    <div class="nav-right">
      <a href="apply.html" class="btn active">APPLY NOW</a>
    </div>
  </header>

  <div class="container">
    <h1>Lease Application</h1>
    <p style="color: #666;">Please fill out the form below to apply for a property. We'll review your application and get back to you soon!</p>

    <form id="applicationForm">
      <label for="firstName">First Name:</label>
      <input type="text" id="firstName" required>

      <label for="lastName">Last Name:</label>
      <input type="text" id="lastName" required>

      <label for="email">Email:</label>
      <input type="email" id="email" required>

      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" required>

      <label for="property">Interested Property:</label>
      <select id="property" required>
        <option value="" disabled selected>Select a property</option>
        <option value="Property A">Property A</option>
        <option value="Property B">Property B</option>
      </select>

      <label for="moveIn">Preferred Move-In Date:</label>
      <input type="text" id="moveIn" required placeholder="Select a date at least 30 days from today">

      <label for="duration">Lease Duration:</label>
      <select id="duration" required>
        <option value="" disabled selected>Select duration</option>
        <option value="12 months">12 months</option>
        <option value="6 months">6 months</option>
        <option value="Other">Other</option>
      </select>

      <label for="occupants">Number of Occupants:</label>
      <input type="number" id="occupants" min="1" max="10" required>

      <label for="message">Additional Comments (Optional):</label>
      <textarea id="message" placeholder="Tell us about yourself or any special requests..."></textarea>

      <button type="submit">Submit Application</button>
      <div id="status"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script>
    // Initialize flatpickr for move-in date with 30-day minimum
    const today = new Date();
    const minDate = new Date(today);
    minDate.setDate(minDate.getDate() + 30); // 30 days from today (reasonable move-in time)

    flatpickr("#moveIn", {
      minDate: minDate,
      dateFormat: "Y-m-d",
      disableMobile: true, // Use flatpickr on mobile too to ensure validation
      allowInput: false, // Prevent manual date entry to enforce validation
      placeholder: "Select a date at least 30 days from today",
      disable: [
        function(date) {
          // Explicitly disable dates before minimum (prevents selecting dates too soon)
          const checkDate = new Date(date);
          checkDate.setHours(0, 0, 0, 0);
          return checkDate < minDate;
        }
      ]
    });

    document.getElementById('applicationForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const firstName = document.getElementById('firstName').value;
      const lastName = document.getElementById('lastName').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const property = document.getElementById('property').value;
      const moveIn = document.getElementById('moveIn').value;
      const duration = document.getElementById('duration').value;
      const occupants = document.getElementById('occupants').value;
      const message = document.getElementById('message').value;

      const status = document.getElementById('status');
      
      try {
        const res = await fetch('/api/application', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            firstName,
            lastName,
            email,
            phone,
            property,
            moveIn,
            duration,
            occupants,
            message
          })
        });

        const result = await res.json();
        if (res.ok) {
          status.textContent = 'Application submitted successfully! Check your email for confirmation.';
          status.className = 'status success';
          document.getElementById('applicationForm').reset();
        } else {
          status.textContent = result.error || 'Something went wrong. Please try again.';
          status.className = 'status error';
        }
      } catch (err) {
        status.textContent = 'Connection error. Please check your internet and try again.';
        status.className = 'status error';
      }
    });
  </script>
</body>
</html>
