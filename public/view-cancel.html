<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cancel My Tour</title>
  <link rel="icon" type="image/jpg" href="Images/Logo.jpg">
  <link rel="stylesheet" href="navbar.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 4rem auto;
      background-color: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      border: 1px solid #f3c2c2;
    }
    h1 {
      text-align: center;
      color: #5a1c1c;
    }
    .booking-details {
      margin-top: 2rem;
      background: #fdfdfd;
      padding: 1.25rem;
      border-radius: 8px;
      border: 1px solid #eee;
    }
    .booking-details p {
      margin: 0.5rem 0;
      font-size: 1rem;
    }
    .cancel-btn {
      display: block;
      margin: 2rem auto 0;
      padding: 0.75rem 1.5rem;
      background: #a52828;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .cancel-btn:hover {
      background: #851f1f;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cancel Your Tour</h1>
    <div class="booking-details" id="bookingInfo">
      <!-- Booking info will load here dynamically -->
    </div>
    <button class="cancel-btn" onclick="cancelReservation()">Confirm Cancellation</button>
  </div>

  <script>
    const cancelId = new URLSearchParams(window.location.search).get('id');

    async function loadBookingInfo() {
      try {
        const res = await fetch(`/api/booking?id=${cancelId}`);
        const booking = await res.json();
        if (!booking || !booking.property) {
          document.getElementById('bookingInfo').innerHTML = '<p>Invalid or expired cancellation link.</p>';
          document.querySelector('.cancel-btn').style.display = 'none';
          return;
        }
        document.getElementById('bookingInfo').innerHTML = `
          <p><strong>Name:</strong> ${booking.firstName}</p>
          <p><strong>Property:</strong> ${booking.property}</p>
          <p><strong>Date:</strong> ${booking.date}</p>
          <p><strong>Time:</strong> ${booking.time}</p>
        `;
      } catch (e) {
        document.getElementById('bookingInfo').innerHTML = '<p>Error loading booking information.</p>';
      }
    }

    async function cancelReservation() {
      try {
        const res = await fetch(`/cancel/${cancelId}`, { method: 'DELETE' });
        const result = await res.text();
        alert(result);
        window.location.href = '/';
      } catch (e) {
        alert('Error cancelling the booking. Please try again later.');
      }
    }

    loadBookingInfo();
  </script>
</body>
</html>
