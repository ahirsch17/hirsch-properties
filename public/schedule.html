<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Schedule a Tour</title>
  <link rel="icon" type="image/jpg" href="Images/Logo.jpg">
  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background: url('Images/Tour.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 4rem auto;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.2);
      border: 1px solid #f3c2c2;
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }

    input, select {
      padding: 0.5rem;
      width: 100%;
      margin-top: 0.25rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .times {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }

    .times button {
      flex: 1 1 45%;
      padding: 0.5rem;
      background: #7a7a7a;
      border: none;
      cursor: pointer;
      font-weight: bold;
      border-radius: 5px;
    }

    .times button.selected {
      background: #5a1c1c;
      color: white;
    }

    button {
      margin-top: 1.5rem;
      padding: 0.75rem;
      width: 100%;
      background: #333;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      margin-top: 1rem;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="announcement">
    ONLY 1 Property left for 2025-2026 school year!
  </div>

  <header class="navbar">
    <div class="nav-left">
      <a href="aboutUs.html">About Us</a>
      <a href="properties.html">Our Properties</a>
      <a href="contact.html">Contact Us</a>
      <a href="schedule.html" class="active">Schedule Tour</a>
    </div>
    <div class="logo"><a href="website.html"><img src="Images/LongLogo.jpg" alt="Hirsch Leasing Logo" style="height: 40px;"></a></div>
    <div class="nav-right">
      <a href="apply.html" class="btn">APPLY NOW</a>
    </div>
  </header>

  <div class="container">
    <h1>Schedule a Tour</h1>

    <label for="property">Select Property:</label>
    <select id="property" required>
      <option value="" disabled selected>Select a property</option>
      <option value="Property A">Property A</option>
      <option value="Property B">Property B</option>
    </select>

    <label for="date">Select a date:</label>
    <input type="text" id="date" required placeholder="Choose a date">

    <label>Select a time:</label>
    <div class="times" id="timeSlots">
      <button type="button">9:00 AM</button>
      <button type="button">11:00 AM</button>
      <button type="button">1:00 PM</button>
      <button type="button">3:00 PM</button>
    </div>

    <label for="firstName">First Name:</label>
    <input type="text" id="firstName" required>

    <label for="lastName">Last Name:</label>
    <input type="text" id="lastName" required>

    <label for="email">Your Email:</label>
    <input type="email" id="email" required>

    <button id="book">Book Tour</button>
    <div class="status" id="status"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script>
    let selectedTime = '';
    const timeSlotsContainer = document.getElementById('timeSlots');
    const dateInput = document.getElementById('date');
    const propertyInput = document.getElementById('property');
  
    flatpickr("#date", {
      minDate: "tomorrow", // Can't book for today
      maxDate: new Date(Date.now() + 60 * 24 * 60 * 60 * 1000), // 60 days from today
      dateFormat: "Y-m-d",
      disable: [
        function(date) {
          // Disable weekends (0 = Sunday, 6 = Saturday)
          return date.getDay() === 0 || date.getDay() === 6;
        }
      ],
      onChange: fetchAvailableTimes
    });
  
    propertyInput.addEventListener('change', fetchAvailableTimes);
  
    function fetchAvailableTimes() {
      const date = dateInput.value;
      const property = propertyInput.value;
  
      if (!date || !property) return;
  
      fetch(`/api/available-times?date=${date}&property=${property}`)
        .then(res => {
          if (!res.ok) {
            console.error('API error:', res.status, res.statusText);
            return res.json().then(err => { throw new Error(err.error || 'Server error'); });
          }
          return res.json();
        })
        .then(data => {
          timeSlotsContainer.innerHTML = '';
          console.log('Received data:', data);

          if (data.error) {
            timeSlotsContainer.innerHTML = `<p style="color: red; font-size: 0.95rem;">Error: ${data.error}</p>`;
            selectedTime = '';
            return;
          }

          if (!data.times || data.times.length === 0) {
            timeSlotsContainer.innerHTML = '<p style="color: red; font-size: 0.95rem;">Sorry, no available times for this date. Please choose another.</p>';
            selectedTime = '';
            return;
          }

          data.times.forEach(time => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.innerText = time;
            btn.addEventListener('click', () => {
              selectedTime = time;
              document.querySelectorAll('#timeSlots button').forEach(b => b.classList.remove('selected'));
              btn.classList.add('selected');
            });
            timeSlotsContainer.appendChild(btn);
          });
        })
        .catch(err => {
          console.error('Fetch error:', err);
          timeSlotsContainer.innerHTML = `<p style="color: red; font-size: 0.95rem;">Error loading times: ${err.message}</p>`;
        });
    }
  
    document.getElementById('book').addEventListener('click', async () => {
      const property = propertyInput.value;
      const date = dateInput.value;
      const email = document.getElementById('email').value;
      const firstName = document.getElementById('firstName').value;
      const lastName = document.getElementById('lastName').value;
      const status = document.getElementById('status');
  
      if (!property || !date || !selectedTime || !firstName || !lastName || !email) {
        status.textContent = 'Please fill out all fields.';
        status.style.color = 'red';
        return;
      }
  
      try {
        const res = await fetch('/api/bookings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ property, date, time: selectedTime, email, firstName, lastName })
        });
  
        const result = await res.json();
        if (res.ok) {
          status.textContent = 'Booking confirmed!';
          status.style.color = 'green';
        } else {
          status.textContent = result.error || 'Something went wrong.';
          status.style.color = 'red';
        }
      } catch (err) {
        status.textContent = 'Server connection failed.';
        status.style.color = 'red';
      }
    });
  </script>
</body>
</html>
